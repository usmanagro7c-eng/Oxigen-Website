<!doctype html>

    <!-- Primary SEO -->

      property="og:description"

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"

    <!-- Structured data: helps Google show brand + product rich results -->
    <script type="application/ld+json">
      {

        "@type": "Organization",
        "name": "OxiGen",
        "url": "https://oxigen.usman-agro7c.workers.dev/",

    <!-- Fonts: preconnect first so the stylesheet request starts as early as possible -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
